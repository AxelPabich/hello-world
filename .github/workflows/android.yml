name: Android-Build

on:
  push:
    branches: [main, master, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      major:
        description: "Als Major Release veröffentlichen (dauerhafte Release-Seite v<Version>.<Nr>)"
        type: boolean
        default: false
      rollback_to:
        description: "Rollback: Quelltext dieses Standes (z. B. build-37) als NEUEN Build veröffentlichen"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Bei einem Rollback wird der Quelltext des angegebenen Standes gebaut – aber mit der neuen,
      # höheren Build-Nummer, denn Android installiert keine niedrigere Nummer über eine höhere.
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.rollback_to || github.ref }}

      - name: Version und Quelltext-Stand festhalten
        run: |
          # Build-Nummer = Run-Nummer + Repository-Variable BUILD_OFFSET (nach einem Umzug in ein neues
          # Repository, damit die Nummern weiter steigen – siehe WIEDERHERSTELLEN.md). Sie wird zu versionCode
          # und, zusammen mit der Datei VERSION, zu versionName (z. B. 2.0.<Nummer>) der App.
          OFFSET="${{ vars.BUILD_OFFSET }}"
          echo "BUILD_NUMBER=$(( ${{ github.run_number }} + ${OFFSET:-0} ))" >> "$GITHUB_ENV"
          echo "SRC_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "APP_VERSION=$(cat VERSION 2>/dev/null | tr -d '[:space:]' || true)" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests der Spiellogik
        working-directory: core
        run: ../gradlew test

      # Änderungen dieses Builds: Nummer eintragen (Eintrag "build": 0 oben in aenderungen/aenderungen.json),
      # daraus die Release-Notiz; die App zeigt die Liste nach dem Update unter „Was ist neu?“.
      - name: Änderungen dieses Builds eintragen
        run: |
          python3 - <<'PY'
          import json, os
          p = 'aenderungen/aenderungen.json'
          n = int(os.environ['BUILD_NUMBER'])
          lines = []
          if os.path.exists(p):
              d = json.load(open(p, encoding='utf-8'))
              e = d.get('eintraege', [])
              if e and e[0].get('build', 0) == 0:
                  e[0]['build'] = n
                  json.dump(d, open(p, 'w', encoding='utf-8'), ensure_ascii=False, indent=2)
              if e and e[0].get('build') == n:
                  lines = ['- ' + x for x in e[0].get('punkte', [])]
          open('aenderungen-build.md', 'w', encoding='utf-8').write('\n'.join(lines))
          print('\n'.join(lines) or 'Keine Änderungsliste für diesen Build.')
          PY

      - name: App bauen (Debug-APK)
        run: ./gradlew :app:assembleDebug

      - name: APK mit Build-Nummer benennen
        run: cp app/build/outputs/apk/debug/app-debug.apk "buzzer-build-${BUILD_NUMBER}.apk"

      - name: APK als Artefakt speichern
        uses: actions/upload-artifact@v4
        with:
          name: buzzer-build-${{ env.BUILD_NUMBER }}
          path: buzzer-build-${{ env.BUILD_NUMBER }}.apk

      # Fester Download-Link ohne ZIP, direkt auf dem Tablet installierbar.
      - name: Vorabversion „buzzer-latest“ aktualisieren
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          VERSION_NAME="${APP_VERSION:-1.0}.${BUILD_NUMBER}"
          SOURCE="${GITHUB_REF_NAME} (${SRC_SHA::7})"
          [ -n "$ROLLBACK_TO" ] && SOURCE="ROLLBACK auf ${ROLLBACK_TO} (${SRC_SHA::7})"
          # buzzer.apk bleibt der feste Link, buzzer-build-<Nr>.apk zeigt die Variante.
          cp "buzzer-build-${BUILD_NUMBER}.apk" buzzer.apk
          gh release delete buzzer-latest --yes --cleanup-tag || true
          gh release create buzzer-latest buzzer.apk "buzzer-build-${BUILD_NUMBER}.apk" \
            --prerelease \
            --target "$SRC_SHA" \
            --title "Buzzer – Build ${BUILD_NUMBER}" \
            --notes "Build ${BUILD_NUMBER} (Version ${VERSION_NAME}), automatisch gebaut aus ${SOURCE}. Debug-APK zum Testen.$( [ -s aenderungen-build.md ] && printf '\n\n**Was ist neu:**\n%s' "$(cat aenderungen-build.md)" )"

      # Jeder Build bekommt eine eigene Seite „build-<Nr>“ mit seiner APK; der Stand im Repository
      # (Tag build-<Nr>) bleibt dauerhaft – daraus lässt sich jederzeit ein Rollback bauen.
      # Die APK-Seiten der letzten 10 Builds bleiben, ältere werden gelöscht (die Tags nicht).
      - name: Seite „build-<Nr>“ anlegen, alte aufräumen
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLBACK_TO: ${{ inputs.rollback_to }}
        run: |
          VERSION_NAME="${APP_VERSION:-1.0}.${BUILD_NUMBER}"
          NOTE="Build ${BUILD_NUMBER} (Version ${VERSION_NAME}) aus ${GITHUB_REF_NAME} (${SRC_SHA::7})."
          [ -n "$ROLLBACK_TO" ] && NOTE="Rollback: Quelltext von ${ROLLBACK_TO} (${SRC_SHA::7}) als neuer Build ${BUILD_NUMBER} (Version ${VERSION_NAME})."
          [ -s aenderungen-build.md ] && NOTE="${NOTE}"$'\n\n'"**Was ist neu:**"$'\n'"$(cat aenderungen-build.md)"
          gh release create "build-${BUILD_NUMBER}" "buzzer-build-${BUILD_NUMBER}.apk" \
            --prerelease \
            --target "$SRC_SHA" \
            --title "Buzzer – Build ${BUILD_NUMBER}" \
            --notes "$NOTE"
          gh release list --limit 300 --json tagName --jq '.[].tagName' | { grep '^build-' || true; } | tail -n +11 | while read -r tag; do
            gh release delete "$tag" --yes || true
          done

      # Major Release: eigene, dauerhafte Release-Seite (wird auf GitHub als „Latest“ markiert).
      - name: Major Release veröffentlichen
        if: github.event_name == 'workflow_dispatch' && inputs.major
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MAJOR="${APP_VERSION:-1.0}"
          VERSION_NAME="${MAJOR}.${BUILD_NUMBER}"
          NOTES_FILE="docs/release/${MAJOR}.md"
          [ -f "$NOTES_FILE" ] || { echo "Buzzer ${VERSION_NAME}" > release-notes.md; NOTES_FILE=release-notes.md; }
          gh release create "v${VERSION_NAME}" "buzzer-build-${BUILD_NUMBER}.apk" \
            --target "$SRC_SHA" \
            --latest \
            --title "Buzzer ${MAJOR} – Major Release (Build ${BUILD_NUMBER})" \
            --notes-file "$NOTES_FILE"
